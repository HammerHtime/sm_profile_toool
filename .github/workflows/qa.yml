name: Public Footprint QA

on:
  push:
    branches: [main, qa-rc2, qa-final]
  pull_request:
    branches: [main]

jobs:
  static-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Verify dependencies resolve
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run static release QA
        run: npm run qa

  production-smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: static-qa
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SITE_URL: https://sm-profile-tool.netlify.app
      RELEASE_MARKER: public-footprint-rc2-smoke-v19
    steps:
      - name: Wait for this release to reach Netlify
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 36); do
            body="$(curl -fsS --max-time 12 "$SITE_URL/release.json" 2>/dev/null || true)"
            if printf '%s' "$body" | grep -q "$RELEASE_MARKER"; then
              echo "Release marker is live on attempt $attempt."
              exit 0
            fi
            echo "Waiting for Netlify deployment ($attempt/36)..."
            sleep 10
          done
          echo "Timed out waiting for the expected Netlify release marker."
          exit 1

      - name: Check production pages
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 15 "$SITE_URL/" >/dev/null
          curl -fsS --max-time 15 "$SITE_URL/presenter.html" >/dev/null
          curl -fsS --max-time 15 "$SITE_URL/volunteer.html" >/dev/null

      - name: Check backend health and API configuration
        shell: bash
        run: |
          set -euo pipefail
          health="$(curl -fsS --max-time 20 "$SITE_URL/.netlify/functions/health")"
          HEALTH_JSON="$health" node - <<'NODE'
          const data = JSON.parse(process.env.HEALTH_JSON || "{}");
          if (!data.ok) throw new Error("Production health endpoint did not report ok=true");
          if (!data.blobs?.ok) throw new Error("Netlify Blobs round-trip is not healthy");
          if (!data.liveSearchConfigured) throw new Error("BRAVE_SEARCH_API_KEY is not visible to production functions");
          if (!data.openAIConfigured) throw new Error("OPENAI_API_KEY is not visible to production functions");
          if (!data.googleVisionConfigured) throw new Error("GOOGLE_VISION_API_KEY is not visible to production functions");
          if (!data.googleGeocodingConfigured) throw new Error("GOOGLE_GEOCODING_API_KEY is not visible to production functions");
          console.log("Health OK, Blobs OK, Brave, OpenAI, Google Vision and Geocoding configured.");
          NODE

      - name: Exercise live search provider with synthetic smoke identity
        shell: bash
        run: |
          set -euo pipefail
          tmp_body="$(mktemp)"
          status="$(curl -sS --max-time 60 -o "$tmp_body" -w '%{http_code}'             -H 'content-type: application/json'             -d '{"consent":true,"firstName":"QzzxPublicFootprint","lastName":"SmokeTest20261004","age":"30","city":"Toronto","username":"","clues":""}'             "$SITE_URL/api/live-search")"
          result="$(cat "$tmp_body")"
          rm -f "$tmp_body"

          SEARCH_STATUS="$status" SEARCH_JSON="$result" node - <<'NODE'
          const status = Number(process.env.SEARCH_STATUS || 0);
          const data = JSON.parse(process.env.SEARCH_JSON || "{}");
          if (status !== 200) {
            const detail = [data.error, data.detail, ...(data.providerErrors || [])].filter(Boolean).join(" | ");
            throw new Error("Live search HTTP " + status + (detail ? ": " + detail : ""));
          }
          if (data.dataMode !== "verified") throw new Error("Live search route did not return live public-search mode");
          if (data.provider !== "Brave Search API") throw new Error("Live search did not confirm Brave Search API");
          if (!data.searchHealth || data.searchHealth.completed < 1) throw new Error("No Brave search pass completed");
          if (!data.locationIntelligence?.configured) throw new Error("Google Geocoding was not configured in live search");
          if (!data.locationIntelligence?.searchAnchor?.label) throw new Error("Google Geocoding did not normalize the Toronto search anchor");
          console.log("Live Search API completed with Brave and broad Google geocoding.");
          NODE

      - name: Exercise OpenAI synthesis with synthetic evidence
        shell: bash
        run: |
          set -euo pipefail
          payload='{"consent":true,"evidence":{"subject":{"displayName":"Synthetic QA","city":"Toronto"},"findings":{"publicContent":[{"platform":"Community","title":"Synthetic community item","text":"Synthetic QA attended a public community event in Toronto in May 2025.","date":"2025-05"},{"platform":"Travel","title":"Synthetic travel item","text":"Synthetic QA publicly mentioned a trip to Ottawa in August 2025.","date":"2025-08"}],"timeline":[{"year":2025,"summary":"Synthetic QA appeared at a public community event."}]}}}'
          tmp_body="$(mktemp)"
          status="$(curl -sS --max-time 60 -o "$tmp_body" -w '%{http_code}' -H 'content-type: application/json' -d "$payload" "$SITE_URL/.netlify/functions/summarize")"
          result="$(cat "$tmp_body")"
          rm -f "$tmp_body"

          AI_STATUS="$status" AI_JSON="$result" node - <<'NODE'
          const status=Number(process.env.AI_STATUS||0);
          const data=JSON.parse(process.env.AI_JSON||"{}");
          if(status!==200) throw new Error("AI synthesis HTTP "+status);
          if(!data.intelligence?.aiUsed) throw new Error("OpenAI synthesis did not complete: "+(data.intelligence?.mode||"missing intelligence"));
          if(!data.intelligence?.overview) throw new Error("AI synthesis returned no overview");
          console.log("OpenAI synthesis completed with "+data.intelligence.model+".");
          NODE

      - name: Exercise live photo demo lifecycle
        shell: bash
        run: |
          set -euo pipefail

          create="$(curl -fsS --max-time 30 -H 'content-type: application/json' -d '{}' "$SITE_URL/api/photo-create")"
          id="$(CREATE_JSON="$create" node -e 'const d=JSON.parse(process.env.CREATE_JSON); process.stdout.write(d.id||"")')"
          presenter="$(CREATE_JSON="$create" node -e 'const d=JSON.parse(process.env.CREATE_JSON); process.stdout.write(d.presenterToken||"")')"
          join="$(CREATE_JSON="$create" node -e 'const d=JSON.parse(process.env.CREATE_JSON); const u=new URL(d.joinUrl); process.stdout.write(new URLSearchParams(u.hash.slice(1)).get("token")||"")')"

          test -n "$id"
          test -n "$presenter"
          test -n "$join"

          image_b64='iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII='
          submit_payload="$(ID="$id" JOIN="$join" IMAGE="$image_b64" node - <<'NODE'
          const payload={
            id:process.env.ID,
            joinToken:process.env.JOIN,
            consent:true,
            firstName:"QzzxPhoto",
            lastName:"",
            city:"",
            username:"",
            mime:"image/png",
            imageData:process.env.IMAGE,
            width:1,
            height:1,
            source:"qa",
            voiceSamples:[],
            voiceDelivery:{speakingRateFactor:1}
          };
          process.stdout.write(JSON.stringify(payload));
          NODE
          )"

          submit="$(curl -fsS --max-time 45 -H 'content-type: application/json' -d "$submit_payload" "$SITE_URL/.netlify/functions/photo-submit")"
          SUBMIT_JSON="$submit" node - <<'NODE'
          const data=JSON.parse(process.env.SUBMIT_JSON||"{}");
          if(!data.ok || data.status!=="submitted") throw new Error("Photo submit did not complete");
          NODE

          status_payload="$(ID="$id" PRESENTER="$presenter" node -e 'process.stdout.write(JSON.stringify({id:process.env.ID,presenterToken:process.env.PRESENTER}))')"
          status="$(curl -fsS --max-time 30 -H 'content-type: application/json' -d "$status_payload" "$SITE_URL/.netlify/functions/photo-status")"
          STATUS_JSON="$status" node - <<'NODE'
          const data=JSON.parse(process.env.STATUS_JSON||"{}");
          if(data.status!=="submitted") throw new Error("Photo session is not submitted");
          if(data.image?.mime!=="image/png") throw new Error("Photo metadata did not survive status round-trip");
          if(data.correlation?.attempted!==false) throw new Error("Photo correlation should stay off without a strong identity anchor");
          if(!data.webDetection?.attempted) throw new Error("Google Vision Web Detection did not run");
          if(!data.webDetection?.configured) throw new Error("Google Vision Web Detection was not configured");
          if(data.webDetection?.error) throw new Error("Google Vision Web Detection failed: "+data.webDetection.error);
          console.log("Photo create, Vision web detection, submit, status and privacy guard passed.");
          NODE

          voice_payload="$(ID="$id" PRESENTER="$presenter" node -e 'process.stdout.write(JSON.stringify({id:process.env.ID,presenterToken:process.env.PRESENTER,index:0}))')"
          voice_tmp="$(mktemp)"
          voice_status="$(curl -sS --max-time 45 -o "$voice_tmp" -w '%{http_code}' -H 'content-type: application/json' -d "$voice_payload" "$SITE_URL/.netlify/functions/photo-generated-voice")"
          test "$voice_status" = "200"
          test -s "$voice_tmp"
          rm -f "$voice_tmp"
          echo "Natural OpenAI TTS sample passed."

          erase_payload="$(ID="$id" PRESENTER="$presenter" node -e 'process.stdout.write(JSON.stringify({id:process.env.ID,presenterToken:process.env.PRESENTER}))')"
          erased="$(curl -fsS --max-time 30 -H 'content-type: application/json' -d "$erase_payload" "$SITE_URL/.netlify/functions/photo-erase")"
          ERASE_JSON="$erased" node - <<'NODE'
          const data=JSON.parse(process.env.ERASE_JSON||"{}");
          if(!data.ok || !data.deleted) throw new Error("Photo session erase failed");
          console.log("Photo session erase passed.");
          NODE
