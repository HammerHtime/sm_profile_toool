name: Public Footprint QA

on:
  push:
    branches: [main, qa-rc2]
  pull_request:
    branches: [main]

jobs:
  static-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify dependencies resolve
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run static release QA
        run: npm run qa
